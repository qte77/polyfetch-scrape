[project]
name = "polyfetch-scrape"
version = "0.0.0"
description = "Reusable HTTP scraping toolkit: httpx fallback chain + document-domain API wrappers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "qte77"}]
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "complexipy>=5.4.0",
  "pyright>=1.1.409",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.23.1",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyfetch_scrape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/polyfetch_scrape"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
