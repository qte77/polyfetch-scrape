[project]
name = "polyfetch-scrape"
version = "0.5.0"
description = "Reusable HTTP scraping toolkit: httpx fallback chain + document-domain API wrappers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "qte77"}]
dependencies = [
    "curl-cffi>=0.15.0",
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "patchright>=1.58.2",
    "typer>=0.25.0",
]

[dependency-groups]
dev = [
  "complexipy>=5.4.0",
  "pyright>=1.1.409",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.23.1",
  "ruff>=0.5",
  "types-defusedxml>=0.7.0.20260504",
]

[project.scripts]
polyfetch = "polyfetch_scrape.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyfetch_scrape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q -m 'not e2e'"
filterwarnings = ["error"]
markers = [
  "e2e: hits real network endpoints; opt-in via `pytest -m e2e` or `make test_e2e`",
]

[tool.coverage.run]
source = ["src/polyfetch_scrape"]
branch = true
omit = ["tests/test_e2e.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Graduated per py-harden-ruff §1 (sibling-repo recipe). Baseline + near-free quality + S (bandit).
# Deferred for follow-ups: ANN, D, TC, TRY, C90.
select = [
    "E", "F", "I", "N", "W", "UP",      # baseline
    "B", "S", "SIM", "RUF", "PT", "PGH" # near-free quality + security
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # asserts are pytest's primary contract
    "S311",  # seeded random.Random() in tests is for determinism, not crypto
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"

[tool.bumpversion]
current_version = "0.5.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = false
tag = false
allow_dirty = true
ignore_missing_version = false

# Anchor on the package name so we bump ONLY the [project] version — not this
# table's own current_version (bump-my-version manages that itself).
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "name = \"polyfetch-scrape\"\nversion = \"{current_version}\""
replace = "name = \"polyfetch-scrape\"\nversion = \"{new_version}\""

# uv.lock's self-reference (same name anchor keeps the lockfile in sync).
[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"polyfetch-scrape\"\nversion = \"{current_version}\""
replace = "name = \"polyfetch-scrape\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "README.md"
search = "version-{current_version}-informational"
replace = "version-{new_version}-informational"

# Roll the CHANGELOG: open a fresh [Unreleased] above the new dated section.
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"

# Compare-link footer: repoint [Unreleased] and add the new version's link.
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "compare/v{current_version}...HEAD"
replace = "compare/v{new_version}...HEAD\n[{new_version}]: https://github.com/qte77/polyfetch-scrape/compare/v{current_version}...v{new_version}"
