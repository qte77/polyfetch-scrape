[project]
name = "polyfetch-scrape"
version = "0.3.1"
description = "Reusable HTTP scraping toolkit: httpx fallback chain + document-domain API wrappers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "qte77"}]
dependencies = [
    "curl-cffi>=0.15.0",
    "httpx>=0.28.1",
    "patchright>=1.58.2",
    "typer>=0.25.0",
]

[dependency-groups]
dev = [
  "complexipy>=5.4.0",
  "pyright>=1.1.409",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.23.1",
  "ruff>=0.5",
]

[project.scripts]
polyfetch = "polyfetch_scrape.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyfetch_scrape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q -m 'not e2e'"
filterwarnings = ["error"]
markers = [
  "e2e: hits real network endpoints; opt-in via `pytest -m e2e` or `make test_e2e`",
]

[tool.coverage.run]
source = ["src/polyfetch_scrape"]
branch = true
omit = ["tests/test_e2e.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
