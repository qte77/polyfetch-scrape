# Local lychee config — overrides the upstream qte77/.github default.
# Each exclusion is a deliberate decision, not a blanket bypass:
#
#   - github.com/qte77/polyfetch-scrape/(compare|releases/tag)/ —
#     v0.3.1 and v0.4.0 are tagged, but the pre-0.3.1 versions
#     (v0.1.0/v0.2.0/v0.3.0) were never tagged releases — they exist only as
#     retroactive CHANGELOG history, so their compare/releases links 404 by
#     design. This exclusion is intentional and permanent (kept broad).
#
#   - www.epo.org — intermittent HTTP/2 protocol error from the upstream
#     server (referenced once from docs/scraping-landscape.md). Not under
#     our control.
#
#   - exa.ai/websets, www.lens.org — referenced from
#     docs/scraping-landscape.md as documented anti-bot / rate-limited
#     targets. These returning 429/403 to a CI link checker is the
#     expected behaviour the doc is itself describing; checking them on
#     every PR is noise.
#
#   - www.scrapingcourse.com/(antibot|cloudflare)-challenge — anti-bot demo
#     targets in examples/fallback-tier-targets.txt that 403 every fetch tier
#     by design (that IS the example); same expected-403 noise as above.
exclude = [
    "https://github\\.com/qte77/polyfetch-scrape/(compare|releases/tag)/",
    "https://www\\.epo\\.org/",
    "https://exa\\.ai/",
    "https://www\\.lens\\.org/",
    "https://www\\.scrapingcourse\\.com/(antibot|cloudflare)-challenge",
]
