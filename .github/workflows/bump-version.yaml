---
name: Bump version

# Step 1 of 2 of the release pipeline (see CONTRIBUTING "Releases and versioning").
# Bumps the version files (pyproject.toml, uv.lock self-ref, README badge) via
# bump-my-version (run with uvx — NOT the callowayproject action: since 1.5 it is a
# composite action with unpinned nested actions, which the repo's SHA-pinning
# policy rejects, and it force-pushes to the branch), collects any changelog.d/ fragments into CHANGELOG.md via
# scriv, then opens a chore(release) PR. Tagging + the GitHub Release are handled
# by tag-release.yaml when this PR merges to main (so the tag lands on the merge
# commit, not a throwaway bump-branch commit).
#
# The release commit is created through the GraphQL createCommitOnBranch mutation
# so GitHub signs it with the web-flow key — main's signed-commits ruleset then
# accepts it with no GPG secret and no manual re-sign (previously the unsigned
# bump-my-version commit blocked the PR until an --amend --reset-author dance).
#
# NOTE: merge the bump PR with a PAT — a push made by GITHUB_TOKEN does not
# re-trigger workflows, so tag-release.yaml would not fire otherwise.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: '[major|minor|patch]'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'major'
          - 'minor'
          - 'patch'

env:
  BRANCH_NEW: "bump-${{ github.run_number }}-${{ github.ref_name }}"

jobs:
  bump_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Sync dev deps (for scriv)
        run: uv sync --frozen

      - name: Bump version files (no commit/tag)
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          # Pinned; runs in an isolated uvx env so it never touches uv.lock.
          BMV: bump-my-version@1.5.1
        run: |
          set -euo pipefail
          prev="$(uvx "$BMV" show current_version)"
          uvx "$BMV" bump "$BUMP_TYPE"
          curr="$(uvx "$BMV" show current_version)"
          {
            echo "previous-version=$prev"
            echo "current-version=$curr"
            if [ "$prev" != "$curr" ]; then echo "bumped=true"; else echo "bumped=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Collect changelog fragments into CHANGELOG.md
        if: steps.bump.outputs.bumped == 'true'
        run: |
          if ls changelog.d/*.md >/dev/null 2>&1; then
            uv run scriv collect --version "${{ steps.bump.outputs.current-version }}"
          else
            echo "no changelog fragments to collect"
          fi

      - name: Create signed release commit + open PR
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ env.BRANCH_NEW }}
          BASE: ${{ github.ref_name }}
          VERSION: ${{ steps.bump.outputs.current-version }}
          PREV_VERSION: ${{ steps.bump.outputs.previous-version }}
        run: |
          set -euo pipefail
          # Commit via the GraphQL createCommitOnBranch mutation: GitHub signs
          # commits made through the API (web-flow key), so main's signed-commits
          # ruleset accepts them — no GPG secret, no extra allow-listed action, no
          # manual re-sign. The mutation applies fileChanges on top of an existing
          # branch ref, created at the pre-bump base commit below.
          BASE_OID="$(git rev-parse HEAD)"

          # Enumerate what bump-my-version + scriv changed, relative to base:
          # ACMR = files to add/update (need base64 contents), D = fragments scriv
          # deleted. The mutation reads ONLY these, not local git state.
          git add -A
          mapfile -t ADDED < <(git diff --cached --name-only --diff-filter=ACMR "${BASE_OID}")
          mapfile -t DELETED < <(git diff --cached --name-only --diff-filter=D "${BASE_OID}")

          # Build fileChanges through files, never argv: base64 of uv.lock alone
          # exceeds Linux's 128 KiB per-argument limit (jq "Argument list too long").
          work="$(mktemp -d)"
          : > "$work/additions.jsonl"
          : > "$work/deletions.jsonl"
          for f in "${ADDED[@]:-}"; do
            [ -n "$f" ] || continue
            base64 -w0 "$f" > "$work/b64"
            jq -cn --arg p "$f" --rawfile c "$work/b64" '{path: $p, contents: $c}' \
              >> "$work/additions.jsonl"
          done
          for f in "${DELETED[@]:-}"; do
            [ -n "$f" ] || continue
            jq -cn --arg p "$f" '{path: $p}' >> "$work/deletions.jsonl"
          done

          # Build the payload before creating the branch, so a failure above
          # leaves no orphan bump branch behind.
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg oid "$BASE_OID" \
            --arg headline "chore(release): bump $PREV_VERSION -> $VERSION" \
            --slurpfile additions "$work/additions.jsonl" \
            --slurpfile deletions "$work/deletions.jsonl" \
            '{query: "mutation($i: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $i) { commit { oid } } }",
              variables: {i: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $headline},
                expectedHeadOid: $oid,
                fileChanges: {additions: $additions, deletions: $deletions}}}}' \
            > "$work/payload.json"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${BRANCH}" -f sha="${BASE_OID}"
          gh api graphql --input "$work/payload.json"

          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "chore(release): bump $PREV_VERSION -> $VERSION" \
            --body "Automated version bump \`v$PREV_VERSION\` -> \`v$VERSION\` (signed via createCommitOnBranch). **Merge with a PAT** (not the default GITHUB_TOKEN) so \`tag-release.yaml\` fires — it tags \`v$VERSION\` on the \`$BASE\` merge commit and publishes the GitHub Release from the CHANGELOG section."
