---
# Grouped weekly updates so related bumps land in one PR per ecosystem instead of
# one PR per dependency. The `uv` ecosystem tracks pyproject.toml + uv.lock — this
# is the primary browser-space freshness lever (curl_cffi / patchright bumps carry
# new TLS-impersonation profiles + CDP-leak patches). Adopted from the qte77 siblings.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
